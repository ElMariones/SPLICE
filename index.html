<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splice — browser video splitter</title>
    <meta name="description" content="Mark in and out points on a local video and cut it into numbered clips. Runs entirely in your browser." />
    <meta name="theme-color" content="#07070b" />
    <script>
      // Stamp the theme before first paint so the page never flashes the
      // wrong palette. lib/theme.js takes over once the bundle runs.
      (function () {
        try {
          var stored = localStorage.getItem('splice.theme');
          var explicit = stored === 'light' || stored === 'dark' ? stored : null;
          if (explicit) {
            document.documentElement.dataset.theme = explicit;
            document.documentElement.style.colorScheme = explicit;
          } else {
            // Leave the attribute off so the stylesheet's prefers-color-scheme
            // block decides, and keep following the system from there.
            document.documentElement.style.colorScheme = 'light dark';
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

</html>
